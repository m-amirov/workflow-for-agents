name: foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills / Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill metadata and references
        run: python scripts/validate.py
      - name: Run validator regressions
        run: python -m unittest discover -s tests -v

  windows:
    name: Install and sync / Windows PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test project-scoped install and sync (PowerShell 7)
        shell: pwsh
        run: |
          ./scripts/tests/Smoke.ps1
          ./scripts/tests/TransactionSmoke.ps1
      - name: Smoke test project-scoped install and sync (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/tests/Smoke.ps1

